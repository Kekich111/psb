[tool.pytest.ini_options]
pythonpath = ["app/core", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP035", "UP045", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "app/core"
ignore_missing_imports = true
warn_unused_ignores = false
